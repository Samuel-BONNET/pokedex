services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://admin:password@db:3306/appdb
      JWT_SECRET: supersecretkey
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

  db:
    image: mariadb:11.4
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: appdb
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: